<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e7ff"/>
      <stop offset="0.55" stop-color="#e9fbff"/>
      <stop offset="1" stop-color="#e8f5d2"/>
    </linearGradient>
    <linearGradient id="panoDepthGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18c4d8"/>
      <stop offset="0.22" stop-color="#33e0a1"/>
      <stop offset="0.42" stop-color="#e2ed52"/>
      <stop offset="0.64" stop-color="#f47b28"/>
      <stop offset="0.82" stop-color="#ce2d2b"/>
      <stop offset="1" stop-color="#5c2b8a"/>
    </linearGradient>
    <linearGradient id="depthGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21c9dd"/>
      <stop offset="0.34" stop-color="#52e38b"/>
      <stop offset="0.62" stop-color="#f3de3a"/>
      <stop offset="1" stop-color="#d8293d"/>
    </linearGradient>
    <linearGradient id="mlpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce9ff"/>
      <stop offset="1" stop-color="#8facd8"/>
    </linearGradient>
    <linearGradient id="pcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22364a"/>
      <stop offset="0.55" stop-color="#476a53"/>
      <stop offset="1" stop-color="#b89052"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f1a2e" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#111827"/>
    </marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#3a66b7"/>
    </marker>
    <marker id="dashArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#6b7280"/>
    </marker>
    <clipPath id="panoClip">
      <rect x="64" y="111" width="260" height="124" rx="10"/>
    </clipPath>
    <clipPath id="depthClip">
      <rect x="382" y="330" width="236" height="96" rx="8"/>
    </clipPath>
    <clipPath id="panoDepthClip">
      <rect x="838" y="115" width="270" height="128" rx="10"/>
    </clipPath>
    <style>
      .serif { font-family: "Times New Roman", Georgia, serif; }
      .sans { font-family: "Inter", "Segoe UI", Arial, sans-serif; }
      .title { font-family: "Times New Roman", Georgia, serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .label { font-family: "Times New Roman", Georgia, serif; font-size: 23px; fill: #111827; }
      .small { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 15px; fill: #374151; }
      .tiny { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #4b5563; }
      .symbol { font-family: "Times New Roman", Georgia, serif; font-size: 25px; font-style: italic; fill: #0f172a; }
      .panel { fill: #ffffff; stroke: #c7ceda; stroke-width: 1.2; }
      .softPanel { fill: #fbfdff; stroke: #c7ceda; stroke-width: 1.2; }
      .arrowLine { stroke: #111827; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .blueLine { stroke: #3a66b7; stroke-width: 3; fill: none; marker-end: url(#blueArrow); }
      .dashLine { stroke: #6b7280; stroke-width: 2.5; stroke-dasharray: 7 7; fill: none; marker-end: url(#dashArrow); }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#f7f9fc"/>
  <rect x="18" y="14" width="1244" height="676" rx="28" fill="#ffffff" stroke="#20395c" stroke-width="3" stroke-dasharray="11 8"/>

  <!-- Input panorama -->
  <text x="194" y="76" class="label" text-anchor="middle">Input 360 Panorama</text>
  <text x="194" y="102" class="symbol" text-anchor="middle">I<tspan baseline-shift="sub" font-size="16">pano</tspan></text>
  <g filter="url(#softShadow)">
    <rect x="64" y="111" width="260" height="124" rx="10" fill="url(#skyGrad)" stroke="#1f2937" stroke-width="1.2"/>
    <g clip-path="url(#panoClip)">
      <path d="M55 171 C112 131 150 154 196 129 C246 102 282 139 342 102 L342 246 L55 246 Z" fill="#c7d5ac"/>
      <path d="M58 184 C112 167 141 187 192 159 C238 134 290 159 340 132 L340 247 L58 247 Z" fill="#89b36f" opacity="0.9"/>
      <path d="M65 207 C114 194 167 211 223 188 C260 173 297 192 326 180 L326 246 L65 246 Z" fill="#477c58"/>
      <path d="M44 223 C95 216 139 229 182 219 C232 207 275 218 344 209 L344 247 L44 247 Z" fill="#316c87" opacity="0.55"/>
      <circle cx="118" cy="151" r="16" fill="#f5dd61" opacity="0.85"/>
      <rect x="62" y="111" width="262" height="124" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.12"/>
      <path d="M64 132 C99 126 128 135 166 130 C214 122 261 127 324 119" stroke="#ffffff" stroke-width="2" opacity="0.5" fill="none"/>
    </g>
  </g>

  <!-- Perspective sampling -->
  <path d="M335 172 C360 172 379 172 403 172" class="arrowLine"/>
  <text x="500" y="58" class="label" text-anchor="middle">Perspective Sampling</text>
  <text x="500" y="84" class="small" text-anchor="middle">virtual cameras cover the sphere</text>
  <g filter="url(#softShadow)">
    <rect x="397" y="100" width="210" height="150" rx="14" class="softPanel"/>
    <circle cx="500" cy="172" r="53" fill="#f8fbff" stroke="#9aa8bd" stroke-width="1.2"/>
    <path d="M447 172 C471 143 529 143 553 172 C529 201 471 201 447 172 Z" fill="none" stroke="#9aa8bd" stroke-width="1"/>
    <path d="M500 119 C522 145 522 199 500 225 C478 199 478 145 500 119 Z" fill="none" stroke="#9aa8bd" stroke-width="1"/>
    <path d="M448 152 C470 163 527 163 552 152" fill="none" stroke="#9aa8bd" stroke-width="1"/>
    <path d="M448 192 C470 181 527 181 552 192" fill="none" stroke="#9aa8bd" stroke-width="1"/>
    <g stroke-width="1.6" fill="none">
      <path d="M459 218 l-12 9 l3 -15 z" stroke="#e34b5f"/>
      <path d="M483 224 l-14 7 l5 -15 z" stroke="#e34b5f"/>
      <path d="M506 225 l-13 8 l4 -15 z" stroke="#3a66b7"/>
      <path d="M531 221 l-13 8 l4 -15 z" stroke="#3a66b7"/>
      <path d="M552 212 l-13 8 l4 -15 z" stroke="#3a66b7"/>
    </g>
    <rect x="423" y="118" width="54" height="38" rx="5" fill="#eaf7ff" stroke="#7aa4d9"/>
    <rect x="485" y="112" width="54" height="38" rx="5" fill="#fff2df" stroke="#d9a25d"/>
    <rect x="522" y="157" width="54" height="38" rx="5" fill="#f0ffe7" stroke="#84b96c"/>
    <text x="502" y="243" class="symbol" text-anchor="middle">I<tspan baseline-shift="super" font-size="15">pers</tspan><tspan baseline-shift="sub" font-size="15">i</tspan>, r<tspan baseline-shift="sub" font-size="15">i</tspan>, K<tspan baseline-shift="sub" font-size="15">i</tspan></text>
  </g>

  <!-- Depth priors -->
  <path d="M500 260 C500 283 500 301 500 316" class="dashLine"/>
  <text x="500" y="305" class="small" text-anchor="middle">monocular depth prior</text>
  <g filter="url(#softShadow)">
    <rect x="365" y="318" width="270" height="148" rx="14" class="softPanel"/>
    <text x="500" y="350" class="label" text-anchor="middle">Local Depth Priors</text>
    <g clip-path="url(#depthClip)">
      <rect x="382" y="330" width="236" height="96" fill="url(#depthGrad)"/>
      <path d="M383 409 C423 378 446 404 480 365 C514 327 549 363 619 334 L619 429 L383 429 Z" fill="#14b8a6" opacity="0.35"/>
      <path d="M390 380 C425 372 456 388 490 350 C529 307 559 338 617 302" stroke="#fef08a" stroke-width="13" opacity="0.65" fill="none"/>
      <path d="M382 424 C430 411 463 424 512 398 C556 375 590 392 620 377" stroke="#174ea6" stroke-width="20" opacity="0.25" fill="none"/>
      <path d="M400 343 C420 338 436 342 454 334" stroke="#fff" stroke-width="3" opacity="0.6" fill="none"/>
    </g>
    <text x="500" y="450" class="symbol" text-anchor="middle">d<tspan baseline-shift="sub" font-size="15">i</tspan> and rho<tspan baseline-shift="sub" font-size="15">i</tspan></text>
  </g>

  <!-- Geometric field -->
  <path d="M636 392 C665 392 685 361 704 333" class="dashLine"/>
  <g filter="url(#softShadow)">
    <rect x="680" y="142" width="140" height="308" rx="18" class="panel"/>
    <text x="750" y="174" class="label" text-anchor="middle">Geometric</text>
    <text x="750" y="199" class="label" text-anchor="middle">Field</text>
    <text x="750" y="228" class="symbol" text-anchor="middle">D<tspan baseline-shift="sub" font-size="15">theta</tspan>(r)</text>
    <g>
      <rect x="706" y="258" width="89" height="46" rx="8" fill="#eef6ff" stroke="#8ca5c8"/>
      <text x="750" y="286" class="small" text-anchor="middle">HashGrid</text>
      <path d="M704 325 h92" stroke="#111827" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
      <rect x="701" y="347" width="16" height="60" rx="4" fill="url(#mlpGrad)" stroke="#1f2937"/>
      <rect x="724" y="340" width="16" height="74" rx="4" fill="url(#mlpGrad)" stroke="#1f2937"/>
      <rect x="747" y="340" width="16" height="74" rx="4" fill="url(#mlpGrad)" stroke="#1f2937"/>
      <rect x="770" y="347" width="16" height="60" rx="4" fill="url(#mlpGrad)" stroke="#1f2937"/>
      <text x="744" y="383" class="small" fill="#111827" text-anchor="middle">MLP</text>
    </g>
  </g>

  <!-- Alignment loss box -->
  <g filter="url(#softShadow)">
    <rect x="626" y="490" width="326" height="118" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="789" y="520" class="label" text-anchor="middle">Scale and Bias Alignment</text>
    <text x="789" y="551" class="symbol" text-anchor="middle">rho<tspan baseline-shift="sub" font-size="15">i</tspan> = s<tspan baseline-shift="sub" font-size="15">i</tspan> alpha<tspan baseline-shift="sub" font-size="15">i</tspan> d<tspan baseline-shift="sub" font-size="15">i</tspan> + b<tspan baseline-shift="sub" font-size="15">i</tspan></text>
    <path d="M673 573 H905" stroke="#111827" stroke-width="2" fill="none"/>
    <path d="M673 573 v-12 M905 573 v-12" stroke="#111827" stroke-width="2"/>
    <text x="789" y="595" class="small" text-anchor="middle">smooth L1 depth fitting + scale regularization + local TV</text>
  </g>
  <path d="M760 453 C760 469 770 478 789 490" class="dashLine"/>

  <!-- Panoramic depth output -->
  <path d="M820 280 C845 236 866 210 884 178" class="arrowLine"/>
  <text x="972" y="76" class="label" text-anchor="middle">Panoramic Depth</text>
  <text x="972" y="102" class="symbol" text-anchor="middle">D<tspan baseline-shift="sub" font-size="16">pano</tspan></text>
  <g filter="url(#softShadow)">
    <rect x="838" y="115" width="270" height="128" rx="10" fill="url(#panoDepthGrad)" stroke="#1f2937" stroke-width="1.2"/>
    <g clip-path="url(#panoDepthClip)">
      <path d="M840 211 C895 188 919 208 966 166 C1006 130 1036 151 1112 118 L1112 245 L840 245 Z" fill="#e6ff5c" opacity="0.58"/>
      <path d="M837 230 C892 206 930 227 977 196 C1021 166 1059 176 1114 152" stroke="#16a6c9" stroke-width="24" opacity="0.45" fill="none"/>
      <path d="M845 151 C889 142 920 163 956 142 C1001 117 1050 137 1106 113" stroke="#f9423a" stroke-width="18" opacity="0.62" fill="none"/>
      <path d="M855 126 C912 136 938 118 1000 126 C1042 132 1076 118 1111 123" stroke="#ffffff" stroke-width="2" opacity="0.65" fill="none"/>
    </g>
  </g>

  <!-- Back-projection and point cloud -->
  <path d="M974 257 C974 282 974 309 974 332" class="arrowLine"/>
  <text x="974" y="289" class="small" text-anchor="middle">spherical back-projection</text>
  <text x="974" y="315" class="symbol" text-anchor="middle">x<tspan baseline-shift="sub" font-size="15">uv</tspan> = r<tspan baseline-shift="sub" font-size="15">uv</tspan>D<tspan baseline-shift="sub" font-size="15">pano</tspan>(u,v)</text>

  <text x="974" y="380" class="label" text-anchor="middle">Colored 3D Point Cloud</text>
  <text x="974" y="408" class="symbol" text-anchor="middle">P = {(x<tspan baseline-shift="sub" font-size="15">uv</tspan>, c<tspan baseline-shift="sub" font-size="15">uv</tspan>)}</text>
  <g filter="url(#softShadow)">
    <ellipse cx="980" cy="505" rx="178" ry="90" fill="#f6f8fb" stroke="#c2cad7"/>
    <g opacity="0.98">
      <circle cx="853" cy="503" r="2.1" fill="#2f4658"/><circle cx="866" cy="475" r="2.2" fill="#334d5f"/><circle cx="876" cy="529" r="1.7" fill="#3e5c68"/>
      <circle cx="889" cy="442" r="2.3" fill="#58734e"/><circle cx="896" cy="489" r="2.1" fill="#26455e"/><circle cx="903" cy="552" r="1.8" fill="#b08549"/>
      <circle cx="914" cy="464" r="2.4" fill="#35544f"/><circle cx="921" cy="512" r="2.2" fill="#86a05a"/><circle cx="930" cy="438" r="1.9" fill="#23394e"/>
      <circle cx="936" cy="579" r="2.0" fill="#9c7a43"/><circle cx="944" cy="497" r="2.6" fill="#5d7d58"/><circle cx="951" cy="526" r="2.0" fill="#1f3347"/>
      <circle cx="958" cy="454" r="2.2" fill="#748851"/><circle cx="967" cy="426" r="1.8" fill="#293e52"/><circle cx="972" cy="565" r="2.4" fill="#b28a4e"/>
      <circle cx="980" cy="479" r="2.8" fill="#6f8554"/><circle cx="985" cy="522" r="2.2" fill="#24405a"/><circle cx="991" cy="445" r="1.9" fill="#283a4c"/>
      <circle cx="1000" cy="581" r="2.4" fill="#9a7742"/><circle cx="1006" cy="502" r="2.9" fill="#536f51"/><circle cx="1014" cy="466" r="2.2" fill="#25384c"/>
      <circle cx="1022" cy="541" r="2.6" fill="#83985a"/><circle cx="1028" cy="421" r="1.9" fill="#17283c"/><circle cx="1037" cy="491" r="2.5" fill="#31536a"/>
      <circle cx="1045" cy="565" r="2.3" fill="#bc8e4d"/><circle cx="1053" cy="456" r="2.1" fill="#4e6d50"/><circle cx="1061" cy="526" r="2.0" fill="#2b475d"/>
      <circle cx="1073" cy="483" r="2.4" fill="#769251"/><circle cx="1082" cy="552" r="1.8" fill="#b18243"/><circle cx="1091" cy="436" r="1.9" fill="#1f3347"/>
      <circle cx="1104" cy="502" r="2.0" fill="#334d5f"/><circle cx="1117" cy="472" r="1.7" fill="#6f8654"/><circle cx="1128" cy="535" r="1.7" fill="#a17c45"/>
      <circle cx="891" cy="517" r="1.3" fill="#1d3346"/><circle cx="907" cy="421" r="1.2" fill="#1d3346"/><circle cx="923" cy="558" r="1.2" fill="#1d3346"/>
      <circle cx="941" cy="459" r="1.3" fill="#1d3346"/><circle cx="955" cy="608" r="1.2" fill="#1d3346"/><circle cx="974" cy="402" r="1.4" fill="#1d3346"/>
      <circle cx="995" cy="612" r="1.1" fill="#1d3346"/><circle cx="1016" cy="405" r="1.3" fill="#1d3346"/><circle cx="1032" cy="604" r="1.2" fill="#1d3346"/>
      <circle cx="1058" cy="413" r="1.4" fill="#1d3346"/><circle cx="1076" cy="592" r="1.2" fill="#1d3346"/><circle cx="1099" cy="451" r="1.3" fill="#1d3346"/>
      <circle cx="1121" cy="511" r="1.2" fill="#1d3346"/><circle cx="854" cy="541" r="1.2" fill="#1d3346"/><circle cx="873" cy="456" r="1.3" fill="#1d3346"/>
      <path d="M852 534 C895 470 950 434 1014 446 C1077 458 1117 504 1136 552" stroke="url(#pcGrad)" stroke-width="8" fill="none" opacity="0.42"/>
      <path d="M861 480 C920 540 987 565 1055 536 C1097 518 1121 475 1133 443" stroke="#20364f" stroke-width="6" fill="none" opacity="0.26"/>
      <path d="M892 571 C946 526 997 496 1071 494 C1104 494 1133 506 1150 524" stroke="#b68b4e" stroke-width="7" fill="none" opacity="0.3"/>
    </g>
  </g>

  <!-- Symbol bridge strip -->
  <g>
    <rect x="86" y="614" width="1108" height="38" rx="19" fill="#f4f7fb" stroke="#d1d8e3"/>
    <text x="640" y="640" class="small" text-anchor="middle">
      Symbols: I_pano input panorama  |  I_i^pers perspective crops  |  d_i local depth priors  |  D_theta continuous geometric field  |  D_pano panoramic depth  |  P colored point cloud
    </text>
  </g>

  <text x="640" y="682" class="title" text-anchor="middle">Lifting an In-the-Wild Panorama into a 360-degree 3D Point Cloud</text>
</svg>
